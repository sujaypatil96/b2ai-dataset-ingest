# Derivation rules for the PTSD Checklist for DSM-5 (PCL-5).
# See README.md and docs/adr/0003-*.md.
instrument: ptsd_adult
label: PTSD Checklist for DSM-5 (PCL-5)
recall_window:
  iso8601: P1M
  text: in the past month
  source: published_instrument
  note: >-
    The data dictionary records no window; the published PCL-5 is bounded at one month.
scoring_reference: >-
  Weathers FW, Litz BT, Keane TM, Palmieri PA, Marx BP, Schnurr PP. The PTSD Checklist for
  DSM-5 (PCL-5). National Center for PTSD; 2013. Item-level endorsement is conventionally
  taken at "Moderately" (>=2) on the 0-4 severity scale.
cut_point_note: >-
  This scale rates SEVERITY, not frequency, so its cut-point cannot be aligned by label with
  the PHQ-9's or the DSM-5's frequency scales — no answer here is equivalent to "several
  days". Where the same HPO term is gated by both (e.g. HP:0012154 Anhedonia), the two
  cut-points are deliberately non-commensurable rather than harmonized.
rules:
  - subject_id: b2ai:ptsd_adult.feeling_jumpy
    object_id: HP:0002267
    object_label: Exaggerated startle response
    confidence: 0.9
    present:
      when_value: ">=2"
      note: "'Moderately' or greater"
    absent:
      when_value: "==0"
      note: "'Not at all'"

  - subject_id: b2ai:ptsd_adult.super_alert
    object_id: HP:5200231
    object_label: Hypervigilance
    confidence: 0.9
    present:
      when_value: ">=2"
      note: "'Moderately' or greater"
    absent:
      when_value: "==0"
      note: "'Not at all'"

  - subject_id: b2ai:ptsd_adult.irritable
    object_id: HP:0000718
    object_label: Aggressive behavior
    confidence: 0.75
    present:
      unauthorable: intensity-qualified
      note: >-
        The item is "being extremely irritable, to the point where you yelled, got into
        fights, or destroyed things"; an endorsement cannot say which narrow sense of the
        escalation was meant.
    absent:
      when_value: "==0"
      note: A 0 denies the escalation the HPO definition names.

  - subject_id: b2ai:ptsd_adult.losing_interest
    object_id: HP:0012154
    object_label: Anhedonia
    confidence: 0.95
    present:
      when_value: ">=2"
      note: "'Moderately' or greater"
    absent:
      when_value: "==0"
      note: "'Not at all'"
