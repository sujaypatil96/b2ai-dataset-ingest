# Mapping: voice diagnosis/ tables -> DiseaseObservation (IR)
# PLACEHOLDER — the per-condition file basename selects a MONDO term.
#
# Each diagnosis/<condition>.tsv lists participants with that condition. The reader emits
# one DiseaseObservation per (participant, condition). `control` is modeled as an excluded
# disease (or skipped) rather than a MONDO term — decided next task.

table_group: diagnosis
keyed_by: [participant_id, session_id]
produces: DiseaseObservation

# file basename (without .tsv) -> MONDO term.  TODO: verify every CURIE/label.
conditions:
  airway_stenosis: { id: "MONDO:0000000", label: "TODO" }
  amyotrophic_lateral_sclerosis: { id: "MONDO:0004976", label: "amyotrophic lateral sclerosis" }
  anxiety: { id: "MONDO:0000000", label: "TODO" }
  benign_lesions: { id: "MONDO:0000000", label: "TODO" }
  bipolar_disorder: { id: "MONDO:0004985", label: "bipolar disorder" }
  cognitive_impairment: { id: "MONDO:0000000", label: "TODO" }
  copd_and_asthma: { id: "MONDO:0000000", label: "TODO" }
  depression: { id: "MONDO:0002009", label: "depressive disorder" }
  glottic_insufficiency: { id: "MONDO:0000000", label: "TODO" }
  huntingtons_disease: { id: "MONDO:0007739", label: "Huntington disease" }
  laryngeal_cancer: { id: "MONDO:0005051", label: "laryngeal cancer" }
  laryngeal_dystonia: { id: "MONDO:0000000", label: "TODO" }
  laryngitis: { id: "MONDO:0000000", label: "TODO" }
  muscle_tension_dysphonia: { id: "MONDO:0000000", label: "TODO" }
  parkinsons_disease: { id: "MONDO:0005180", label: "Parkinson disease" }
  precancerous_lesions: { id: "MONDO:0000000", label: "TODO" }
  unexplained_chronic_cough: { id: "MONDO:0000000", label: "TODO" }
  unilateral_vocal_fold_paralysis: { id: "MONDO:0000000", label: "TODO" }

# 'control' is not a disease; handled specially (TODO: skip vs. excluded=true).
control_handling: skip
