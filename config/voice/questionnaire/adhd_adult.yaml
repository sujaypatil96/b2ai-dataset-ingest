# Mapping: voice questionnaire/adhd_adult.tsv -> Measurement (IR)
# Adult ADHD Self-Report Scale (ASRS v1.1), 18 items.
#
# Answers are string codes (never/rarely/.../veryOften) with no numeric `value` in the
# data dict, so the engine scores them by their **position** in the choice list (0-4) --
# the ASRS convention. `ordinal_scale` below is the label-keyed fallback only.
#
# No public per-item LOINC/NCIT code was verified for this instrument, so items use
# project-local `b2ai:` codes -- the same documented stopgap as vhi10.yaml (see
# ontology/resources.py). Replace them if verified public codes are found.
#
# This table ships no precomputed total, so no `score:` block (decision 2).
#
# HPO-gated columns (mappings/b2ai-voice-questionnaires.sssom.tsv): difficulty_attention, overly_active, interrupt_others.

table: adhd_adult
produces: MeasurementObservation

# Session-key candidates (first present wins): synthetic `session_id`, else the real
# per-instrument column. See gad7.yaml for the rationale.
session_columns: [session_id, adhd_session_id]

# Fallback answer->value map, used only when the companion data dict is unavailable.
ordinal_scale:
  "Never": 0
  "Rarely": 1
  "Sometimes": 2
  "Often": 3
  "Very Often": 4

# Per-item assay terms (column -> project-local OntologyClass).
items:
  avoidance: { id: "b2ai:adhd_adult-avoidance", label: "When you have a task that requires a lot of thought, how often do you avoid or delay getting started?" }
  careless: { id: "b2ai:adhd_adult-careless", label: "How often do you make careless mistakes when you have to work on a boring or difficult project?" }
  difficulty_attention: { id: "b2ai:adhd_adult-difficulty_attention", label: "How often do you have difficulty keeping your attention when you are doing boring or repetitive work?" }
  difficulty_concentrating: { id: "b2ai:adhd_adult-difficulty_concentrating", label: "How often do you have difficulty concentrating on what people say to you, even when they are speaking to you directly?" }
  difficulty_unwinding: { id: "b2ai:adhd_adult-difficulty_unwinding", label: "How often do you have difficulty unwinding and relaxing when you have time to yourself?" }
  difficulty_waiting: { id: "b2ai:adhd_adult-difficulty_waiting", label: "How often do you have difficulty waiting your turn in situations when turn taking is required?" }
  distracted: { id: "b2ai:adhd_adult-distracted", label: "How often are you distracted by activity or noise around you?" }
  fidget: { id: "b2ai:adhd_adult-fidget", label: "How often do you fidget or squirm with your hands or feet when you have to sit down for a long time?" }
  finish_other_sent: { id: "b2ai:adhd_adult-finish_other_sent", label: "When you're in a conversation, how often do you find yourself finishing the sentences of the people you are talking to, before they can finish them themselves?" }
  interrupt_others: { id: "b2ai:adhd_adult-interrupt_others", label: "How often do you interrupt others when they are busy?" }
  misplace: { id: "b2ai:adhd_adult-misplace", label: "How often do you misplace or have difficulty finding things at home or at work?" }
  overly_active: { id: "b2ai:adhd_adult-overly_active", label: "How often do you feel overly active and compelled to do things, like you were driven by a motor?" }
  remain_seated: { id: "b2ai:adhd_adult-remain_seated", label: "How often do you leave your seat in meetings or other situations in which you are expected to remain seated?" }
  remembering_appt: { id: "b2ai:adhd_adult-remembering_appt", label: "How often do you have problems remembering appointments or obligations?" }
  restless: { id: "b2ai:adhd_adult-restless", label: "How often do you feel restless or fidgety?" }
  talking_too_much: { id: "b2ai:adhd_adult-talking_too_much", label: "How often do you find yourself talking too much when you are in social situations?" }
  things_in_order: { id: "b2ai:adhd_adult-things_in_order", label: "How often do you have difficulty getting things in order when you have to do a task that requires organization?" }
  wrapping_up: { id: "b2ai:adhd_adult-wrapping_up", label: "How often do you have trouble wrapping up the final details of a project, once the challenging parts have been done?" }
