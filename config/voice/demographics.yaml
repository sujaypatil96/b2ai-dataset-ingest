# Mapping: voice demographics/ table -> Individual (IR)
#
# The demographics table is wide (~150 columns) and very sparse (in the synthetic data,
# sex/gender are 0/407 filled, age 20/407). Only the columns needed to populate an
# Individual are mapped; the rest are intentionally ignored. Emit what is present.
#
# `gender_identity` is intentionally NOT mapped in v1: there is no agreed ontology coding
# for it yet (GSSO/NCIT) and it is unfilled in the synthetic data. Add it in a follow-up.

table: demographics
produces: Individual
# One Individual per participant_id; demographics is not keyed by session.

# Each entry maps a source column to an IR Individual field.
# `transform` names a value-normalization rule; `value_map` gives inline recodes.
columns:
  # participant_id -> Individual.id is handled by the reader, not a column mapping.
  age:
    target: Individual.age_iso8601
    transform: years_to_iso8601           # e.g. "63" / "54.0" -> "P63Y" / "P54Y"
  # Sex is carried by two columns, and BOTH are mapped -- declaration order is the
  # precedence rule. `individual_fields` iterates `columns` in order and a later non-empty
  # value overwrites an earlier one, so `sex_assigned_at_birth` is the fallback and
  # `sex_at_birth` wins wherever it is filled.
  #
  # Why prefer `sex_at_birth`: in the real b2aiprep release it is populated 908/916 rows vs
  # 84/916 for `sex_assigned_at_birth`; reading only the sparse column left 51 of 833
  # phenopackets with a known sex. Where both are filled they agree, except for 25 rows
  # where `sex_assigned_at_birth` is "Prefer not to answer" -- a later re-ask the
  # participant declined, which that column does not reflect.
  #
  # Why keep `sex_assigned_at_birth`: 2 real rows carry it and no `sex_at_birth`, and the
  # public synthetic release ships ONLY this column -- dropping it made `b2ai-ingest
  # validate` fail against the synthetic tree and left `Individual.sex` permanently unset
  # there. See tests/test_config_mappings.py::test_mapped_columns_exist_in_synthetic_data.
  sex_assigned_at_birth: &sex_at_birth_mapping
    target: Individual.sex
    # Source stores the display label; codes are accepted too for robustness.
    value_map:
      Male: MALE
      male: MALE
      Female: FEMALE
      female: FEMALE
      Intersex: OTHER_SEX
      intersex: OTHER_SEX
      Unknown: UNKNOWN_SEX
      unknown: UNKNOWN_SEX
      "Prefer not to answer": UNKNOWN_SEX
      noAnswer: UNKNOWN_SEX
  # Same recodes; listed second so a filled `sex_at_birth` takes precedence.
  sex_at_birth: *sex_at_birth_mapping
