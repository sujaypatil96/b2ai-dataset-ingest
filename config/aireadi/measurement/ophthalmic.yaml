# Mapping: AI-READI clinical_data/measurement.csv, per-eye ophthalmic items -> MeasurementObservation (IR)
#
# 26 items: visual acuity, contrast sensitivity and autorefraction, each per eye.
#
# LATERALITY IS DECLARED PER ITEM, not read from qualifier_concept_id, and that is
# load-bearing. The six autorefraction items (viaod*/viaos* sph/cyl/axi) are per-eye by
# NAME and carry NO qualifier at all -- 573 rows would lose their side. Worse, the same
# qualifier column on a medical-history observation row holds a CONDITION NAME
# ('Hypertensive Disorder'), so a passthrough would be actively wrong. The column is a
# cross-check for validate-aireadi, never the source.
#
# body_site goes on Measurement.procedure.body_site -- the only laterality slot a GA4GH
# Measurement has. UBERON:0004549/0004548 verified against sqlite:obo:uberon on
# 2026-09-09; NCIT procedure codes verified against sqlite:obo:ncit the same day.
#
# ASSAY IDENTITY. Items with a verified LOINC code carry it; the rest carry a project-local
# `b2ai:measurement.<item>` id with a curated label. That stopgap is the documented VHI-10
# precedent already shipping in config/voice/questionnaire/vhi10.yaml (`b2ai:vhi10.total`),
# and it decouples delivery from the LOINC curation tranche: a later PR replaces `id:` in
# place and nothing else changes. A `TODO` id would be SKIPPED at read time, which is why
# none appears here.
#
# LOINC codes below were verified by exact-code lookup against the NLM Clinical Table LOINC
# service on 2026-09-09 -- the same route config/voice/questionnaire/phq9.yaml used. LOINC
# is deliberately absent from mappings/*.sssom.tsv: oaklib has no usable LOINC build
# (`sqlite:obo:loinc` resolves to a 0-byte database and raises OperationalError), so a LOINC
# SSSOM set would sit behind an anti-hallucination gate that cannot actually check it.

table: measurement
delimiter: ","
id_column: person_id
key_column: measurement_source_value
date_column: measurement_datetime
visit_column: visit_occurrence_id
value_columns: [value_as_number]

measures:
  viaodplog:
    assay: { id: "b2ai:measurement.viaodplog", label: "VA letter score, photopic, right eye" }
    unit: { id: "UCUM:{score}", label: "score" }
    procedure_code: { id: "NCIT:C87149", label: "Visual Acuity" }
    body_site: { id: "UBERON:0004549", label: "right eye" }
