# Mapping: AI-READI clinical_data/person.csv -> Individual (IR)
#
# FULLY REDACTED IN THE MINI RELEASE. Verified 2026-09-09: gender_concept_id,
# race_concept_id and ethnicity_concept_id are 0 on all 100 rows and every *_source_value
# is blank. dataset_description.json says so outright: "Information related to the sex and
# race/ethnicity of the participants as well as medication used has also been removed."
# `validate-aireadi` and the ingest report both surface this as a named redaction count, so
# a run producing 100 UNKNOWN_SEX subjects cannot be mistaken for a clean run.
#
# This config is written for the FULL release so it needs no rewrite when real demographics
# land. `"0": null` is the engine's existing recode-to-nothing idiom -- MappingEngine._recode
# returns the mapped None and individual_fields drops the field -- so the mini leaves
# Individual.sex unset quietly and correctly instead of logging 100 value_map misses.
#
# NOT MAPPED: birth_datetime is the sentinel 1970-01-01 00:00:00 and month/day_of_birth are
# 0. year_of_birth is real, but year of birth combined with a visit date is a
# re-identification vector, and it disagrees with participants.tsv `age` by more than a
# year for 4 of 100 participants. Age comes from participants.tsv.
#
# UNVERIFIED: the OMOP gender concept ids 8507/8532 could not be confirmed against a CONCEPT
# table in this session -- the release ships none and the Athena API returns HTTP 403 from
# here. They are used ONLY as value_map keys and are never emitted, so a wrong key yields an
# unset sex rather than a wrong one. Confirm before the full release is ingested.

table: person
delimiter: ","
produces: Individual
id_column: person_id

columns:
  gender_concept_id:
    target: Individual.sex
    value_map:
      "8507": MALE
      "8532": FEMALE
      "0": null            # redacted / no matching concept -> leave Individual.sex unset
  # Declared second so a populated source value wins by declaration order -- the same
  # precedence idiom config/voice/demographics.yaml uses for its two sex columns.
  gender_source_value:
    target: Individual.sex
    value_map:
      Male: MALE
      male: MALE
      Female: FEMALE
      female: FEMALE

# race / ethnicity: DEFERRED. config/shared/value_sets.yaml still records
# "ethnicity / race codings: TODO (decide ontology - NCIT / HANCESTRO)", and this release
# carries nothing to map.
