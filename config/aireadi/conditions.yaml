# Mapping: AI-READI clinical_data/condition_occurrence.csv -> DiseaseObservation (IR)
#
# 557 rows, 28 distinct item keys. Membership is presence of a row, exactly as a Voice
# diagnosis/<basename>.tsv row is; the difference is that the condition is named by an item
# key rather than a filename.
#
# NO ONSET IS EMITTED, and that is a decision, not an omission. Verified over all 557 rows
# on 2026-09-09: condition_start_date == condition_end_date on 557/557, and it equals one of
# that participant's medical-history survey dates on 557/557. It is the date the
# medical-history form was filled in, not any onset. Emitting it as Disease.onset would
# assert a false natural history that a downstream consumer could not tell was false.
#
# LABEL SOURCE: the parallel observation row for the same item key carries the UNTRUNCATED
# OMOP concept name in qualifier_source_value ("mhoccur_hbp" -> "Hypertensive Disorder").
# condition_source_value is truncated at 49 characters and is never used as a label.
#
# MONDO CURIEs below were found by SEARCHING the pinned MONDO release with oaklib and
# verified id -> label on 2026-09-09; none was typed from memory. The four TODO entries are
# deliberate and are skipped at read time with a warning (see the notes beside each) --
# `mappings/b2ai-aireadi-conditions.sssom.tsv` is the shareable, CI-enforced form of the
# same 24 decisions.

table: condition_occurrence
delimiter: ","
produces: DiseaseObservation
id_column: person_id
key_column: condition_source_value
date_column: condition_start_date
visit_column: visit_occurrence_id
emit_onset: false                    # see header; *_start_date is the form-fill date

conditions:
  mhoccur_hbp:   { id: "MONDO:0005044", label: "hypertensive disorder" }            # 316866    n=59
  mhoccur_clsh:  { id: "MONDO:0021187", label: "hyperlipidemia" }                   # 4159131   n=52  broader than "high blood cholesterol"
