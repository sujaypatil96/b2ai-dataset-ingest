# Mapping: voice questionnaire/phq9.tsv -> Measurement (IR)
# PHQ-9 depression screener.
#
# v1 emits per-item ordinal Measurements only. Each item's answer -> Quantity(value=<int>,
# unit=UCUM {score}); the integer for an answer string comes from the companion phq9.json
# data dict's per-item `choices` (which also covers items on a different scale, e.g.
# `hard_to_work`), falling back to `ordinal_scale` below when no data dict is present.
#
# No whole-instrument total: the synthetic PHQ-9 table ships no total column (and items are
# sparse), so per decision 2 we do NOT compute one. No HPO PhenotypicFeature yet
# (decision 1 — the ordinal->present/absent threshold policy is deferred).
#
# Item LOINC codes verified against the NLM Clinical Table LOINC service on 2026-07-06.

table: phq9
keyed_by: [participant_id, session_id]
produces: MeasurementObservation

# Fallback answer->value map, used only when the companion data dict is unavailable
# (e.g. the multisession test fixture). Real data uses the data dict `choices`.
ordinal_scale:
  "Not at all": 0
  "Several days": 1
  "More than half the days": 2
  "Nearly every day": 3

# Per-item assay terms (column -> LOINC OntologyClass).
items:
  no_interest: { id: "LOINC:44250-9", label: "Little interest or pleasure in doing things" }
  feeling_depressed: { id: "LOINC:44255-8", label: "Feeling down, depressed, or hopeless" }
  trouble_sleeping: { id: "LOINC:44259-0", label: "Trouble falling or staying asleep, or sleeping too much" }
  no_energy: { id: "LOINC:44254-1", label: "Feeling tired or having little energy" }
  no_appetite: { id: "LOINC:44251-7", label: "Poor appetite or overeating" }
  feeling_bad_self: { id: "LOINC:44258-2", label: "Feeling bad about yourself, or that you are a failure" }
  trouble_concentrate: { id: "LOINC:44252-5", label: "Trouble concentrating on things" }
  move_speak_slow: { id: "LOINC:44253-3", label: "Moving or speaking slowly, or being fidgety or restless" }
  thoughts_death: { id: "LOINC:44260-8", label: "Thoughts that you would be better off dead, or of hurting yourself" }
  hard_to_work: { id: "LOINC:69722-7", label: "How difficult have these problems made it to work / cope" }
